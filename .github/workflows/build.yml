name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (官方安装脚本，非交互)
        run: |
          export THEOS="$HOME/theos"
          export CI=1
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: 打印环境（排错用）
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS/toolchain/linux/iphone/bin" | head
          ls "$THEOS/sdks"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -3
          which dpkg-deb ldid fakeroot make

      - name: Build rootless (iphoneos-arm64)
        run: |
          make clean >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p out
          ls -l packages/
          cp packages/*.deb out/vpntint-rootless.deb

      - name: Build roothide (iphoneos-arm64e)
        run: |
          rm -rf packages
          make clean >/dev/null 2>&1 || true
          if make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide; then
            echo "roothide scheme 构建成功"
          else
            echo "roothide scheme 不可用，改用 rootful 布局 + 改 Architecture"
            make clean >/dev/null 2>&1 || true
            rm -rf packages
            make package FINALPACKAGE=1
            f=$(ls packages/*.deb | head -1)
            rm -rf /tmp/rp && mkdir -p /tmp/rp
            dpkg-deb -R "$f" /tmp/rp
            perl -pi -e 's/^Architecture:.*$/Architecture: iphoneos-arm64e/' /tmp/rp/DEBIAN/control
            dpkg-deb -b /tmp/rp packages/vpntint-roothide.deb
            rm -f "$f"
          fi
          ls -l packages/
          cp packages/*.deb out/vpntint-roothide.deb

      - name: Verify packages
        run: |
          set -e
          for f in out/*.deb; do
            echo "========== $f"
            dpkg-deb -I "$f"
            rm -rf /tmp/x && mkdir -p /tmp/x
            dpkg-deb -x "$f" /tmp/x
            echo "--- 包内文件 ---"
            find /tmp/x -type f | sed 's|/tmp/x||'
            echo "--- dylib 架构 ---"
            find /tmp/x -name 'VpnTint.dylib' -exec lipo -detailed_info {} \; | grep -E 'architecture|subtype|Non-fat|fat file'
            echo "--- filter plist ---"
            find /tmp/x -name 'VpnTint.plist' -exec plutil -lint {} \;
            echo "--- postinst 可执行位 ---"
            ls -l /tmp/x/DEBIAN/postinst 2>/dev/null || true
          done
          dylib=$(find /tmp/x -name 'VpnTint.dylib' | head -1)
          archs=$(lipo -archs "$dylib")
          echo "dylib archs: $archs"
          echo "$archs" | tr ' ' '\n' | grep -qx arm64
          echo "$archs" | tr ' ' '\n' | grep -qx arm64e

      - uses: actions/upload-artifact@v4
        with:
          name: vpntint-debs
          path: out/*.deb

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: VpnTint 1.0.0
          body: |
            VPN 连接时状态栏 Wi-Fi 图标 / 蜂窝信号 / 4G-5G 字样变橙色，断开恢复默认色。

            - `vpntint-rootless.deb`：Dopamine / palera1n rootless（有 /var/jb）
            - `vpntint-roothide.deb`：RootHide / roothide bootstrap（iphoneos-arm64e）
          files: out/*.deb
