name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          # zstd：roothide 包的 data.tar.zst 要让 verify_release.py 解开。
          # CI 的 python3 是 3.12/3.13，没有 compression.zstd，只能靠这个命令兜底。
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git xz-utils zstd libtinfo6 libssl-dev dpkg
          # theos 自带的 plistutil 依赖 libplist，24.04 上包名可能不同，逐个试
          for p in libplist-2.0-4 libplist-2.0-3 libplist3 libplist-utils; do
            sudo apt-get install -y "$p" || echo "skip $p"
          done
          ldconfig -p | grep -i libplist || echo "无 libplist"
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv || true

      - name: 安装 Theos + LLVM 工具链 + SDK（手动，不用官方脚本以免 libxml2 依赖炸掉）
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "$THEOS/toolchain/linux/iphone/bin" >> "$GITHUB_PATH"

          mkdir -p "$THEOS/toolchain"
          curl -sL --retry 3 -o /tmp/tc.tar.xz \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz
          ls -l /tmp/tc.tar.xz
          tar -xJf /tmp/tc.tar.xz -C "$THEOS/toolchain"

          ls "$THEOS/toolchain/linux/iphone/bin" | head -30

          # ldid：工具链里没有就单独下 Procursus 的 Linux 版
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ldid" ]; then
            curl -sL --retry 3 -o /tmp/ldid \
              https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
            chmod +x /tmp/ldid
            cp /tmp/ldid "$THEOS/bin/ldid"
            cp /tmp/ldid "$THEOS/toolchain/linux/iphone/bin/ldid"
          fi

          "$THEOS/bin/install-sdk" latest
          ls "$THEOS/sdks"

      - name: 打印环境（排错用，全部容错，不影响结论）
        run: |
          echo "THEOS=$THEOS"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -3 || true
          for t in dpkg-deb fakeroot make ldid lipo ld64; do
            p=$(command -v "$t" 2>/dev/null || echo "-")
            echo "tool $t -> $p"
          done
          ls "$THEOS/toolchain/linux/iphone/bin" | tr '\n' ' '; echo
          echo "PATH=$PATH"

      - name: 源码闸门（钉住 iOS 17 的 hook 目标，反向自检先跑）
        run: |
          set -e
          # 反向自检：先确认每条判据都能失败，否则下面的「全通过」是装饰
          python3 tools/check_source.py --selftest
          python3 tools/check_source.py

      - name: Build rootless (iphoneos-arm64)
        run: |
          make clean >/dev/null 2>&1 || true
          # 编译日志同时落到文件：Actions 的 logs 端点在本账号下鉴权受限，
          # 拿不到时只能靠这个 artifact 排错。PIPESTATUS 保住 make 的真实退出码。
          set +e
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee /tmp/build-rootless.log
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || { echo "rootless 构建失败 rc=$rc"; exit "$rc"; }
          mkdir -p out
          ls -l packages/
          cp packages/*.deb out/vpntint-rootless.deb

      - name: Build roothide (iphoneos-arm64e)
        run: |
          rm -rf packages
          make clean >/dev/null 2>&1 || true
          # 注意：`cmd | tee` 的退出码是 tee 的，必须用 PIPESTATUS 取 make 的真实结果，
          # 否则失败会被当成成功一路走下去（这里踩过）。
          set +e
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee /tmp/build-roothide.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "roothide scheme 构建成功"
          else
            echo "roothide scheme 不可用（rc=$rc），改用 rootful 布局 + 改 Architecture"
            make clean >/dev/null 2>&1 || true
            rm -rf packages
            make package FINALPACKAGE=1 2>&1 | tee -a /tmp/build-roothide.log
            f=$(ls packages/*.deb | head -1)
            rm -rf /tmp/rp && mkdir -p /tmp/rp
            dpkg-deb -R "$f" /tmp/rp
            perl -pi -e 's/^Architecture:.*$/Architecture: iphoneos-arm64e/' /tmp/rp/DEBIAN/control
            dpkg-deb -b /tmp/rp packages/vpntint-roothide.deb
            rm -f "$f"
          fi
          ls -l packages/
          cp packages/*.deb out/vpntint-roothide.deb

      - name: 修 arm64e ptrauth ABI 标志（必须早于所有产物校验）
        run: |
          set -e
          LDID="$THEOS/toolchain/linux/iphone/bin/ldid"
          [ -x "$LDID" ] || LDID="$THEOS/bin/ldid"
          [ -x "$LDID" ] || LDID="$(command -v ldid || true)"
          echo "ldid = $LDID"
          [ -n "$LDID" ] && [ -x "$LDID" ] || { echo "FAIL: 找不到 ldid"; exit 1; }

          # 先证明「这条修复真的会动手」：修之前必须被判缺标志。
          # 没有这一步，下面「修完通过」可能只是因为本来就没缺陷。
          if python3 tools/fix_deb_abi.py out/vpntint-roothide.deb --check-only; then
            echo "注意：arm64e 本来就带 PTRAUTH_ABI，本步将 no-op"
          else
            echo "OK: 确认修前缺 CPU_SUBTYPE_PTRAUTH_ABI，开始修"
          fi

          # 补 caps 会改字节，页哈希立刻失效，所以这里必然重签。
          python3 tools/fix_deb_abi.py out/vpntint-roothide.deb --ldid "$LDID"

          # 复核：两个包的所有 dylib 签名都必须覆盖当前字节
          for f in out/*.deb; do
            python3 tools/check_codesign.py "$f" || { echo "FAIL: $f 签名无效"; exit 1; }
          done

      - name: 上传编译日志（失败时也要有）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/build-*.log
          if-no-files-found: ignore

      - name: 校验产物
        run: |
          set -e
          # 反向自检：先确认检查脚本真的会失败，否则下面那条断言就是装饰
          rm -rf /tmp/selftest && mkdir -p /tmp/selftest
          printf '#!/bin/sh\nkillall -9 SpringBoard\n' > /tmp/selftest/postinst
          if sh tools/check_scripts.sh /tmp/selftest; then
            echo "FAIL: 自检脚本没拦住 killall SpringBoard，检查本身失效"
            exit 1
          fi
          echo "OK: 自检能拦住重启桌面动作"
          for f in out/*.deb; do
            echo "========== $f"
            dpkg-deb -I "$f"
            rm -rf /tmp/x /tmp/ctl && mkdir -p /tmp/x /tmp/ctl
            dpkg-deb -x "$f" /tmp/x
            dpkg-deb -e "$f" /tmp/ctl
            echo "--- 包内文件 ---"
            find /tmp/x -type f | sed 's|/tmp/x||'
            echo "--- 控制脚本 ---"
            ls -l /tmp/ctl
            echo "--- dylib 架构（直接解析 Mach-O 头）---"
            dylib=$(find /tmp/x -name 'VpnTint.dylib' | head -1)
            echo "$dylib"
            python3 tools/check_arch.py "$dylib"
            echo "--- filter plist ---"
            python3 -c "import plistlib,glob,sys; p=glob.glob('/tmp/x/**/VpnTint.plist',recursive=True)[0]; d=plistlib.load(open(p,'rb')); print('Filter:', d); assert 'com.apple.springboard' in d['Filter']['Bundles']"
            echo "--- maintainer scripts（不许重启桌面，否则 dpkg 会中断）---"
            sh tools/check_scripts.sh /tmp/ctl
            if ls /tmp/ctl | grep -qx postinst; then
              echo "FAIL: 包里又出现 postinst，1.0.1 起禁止带 maintainer script"
              exit 1
            fi
            echo "OK: 无 postinst"

          done
          # 产物断言集中在 tools/verify_release.py（11 项）：包结构 / 无 maintainer script /
          # 双切片 / filter plist / hook 目标字符串 / 反面禁旧目标。
          # --selftest 先对真实 deb 逐条投毒，证明每条断言真的会失败，
          # 否则下面的「全通过」只是一排永远为真的装饰。
          python3 tools/verify_release.py --selftest out/*.deb
          echo "OK: 两个包都通过校验"

      - uses: actions/upload-artifact@v4
        with:
          name: vpntint-debs
          path: out/*.deb

      # 发布只由手动 dispatch 触发；普通 push 只做构建+校验，
      # 避免每次改代码都把已发布资产重新打包（字节会变，用户手上的哈希就失效）
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.4
          name: VpnTint 1.0.4（修 arm64e 老式 ABI + 日志真正可写）
          body: |
            **请先卸载旧版（1.0.2 / 1.0.3），再装 1.0.4。** 装完手动 respring。

            功能不变：VPN 连接时状态栏 Wi-Fi 图标 / 蜂窝信号 / 4G-5G 字样变橙色，断开恢复默认色。

            ## 1.0.4 修的是什么

            1.0.3 装完仍然进安全模式、而且**找不到 `VpnTint.log`、也没有新的
            `SpringBoard-*.ips`**。这三件事同时成立，指向的不是运行时崩溃，
            而是**加载期就被拒**。这次把静态层查干净，找到两个具体缺陷：

            ### 1. arm64e 切片用的是老式 ABI（头号嫌疑）

            实测 1.0.3 的 arm64e 切片 `cpusubtype = 0x00000002`，
            即高 8 位 caps = `0x00` —— 缺 `CPU_SUBTYPE_PTRAUTH_ABI(0x80)`。
            这是 iOS 12/13 时代的老 arm64e ABI。LLVM 作者原话：

            > Modern arm64e requires versioned binaries: a binary with 0x00 caps
            > in cpusubtype is now rejected by the linker and everything after.

            dyld 在 arm64e 进程里会优先挑 arm64e 切片，于是加载的就是这一片。
            这与「装上即进安全模式、零日志、无新 ips」完全吻合。
            1.0.4 在 CI 里补上该标志并**重新签名**（补字节会让页哈希失效，
            顺序必须是先补后签，已用页面哈希逐页复核）。

            ### 2. 日志路径在 SpringBoard 沙箱里根本不可写

            旧版只往 `/var/mobile/Library/Logs/` 和 `/tmp/` 写，SpringBoard
            沙箱两个都拒绝，而且写失败是静默的。更糟的是 `NSLog` 兜底被放在
            「文件是否可用」判断之后 —— 文件写不了，系统日志也一起哑掉。
            所以「没有日志」这件事，**本身就说明不了插件有没有被加载**。

            现在：`NSHomeDirectory()/Documents/VpnTint.log` 优先 + 多候选 +
            真实试写探针；`NSLog` 提到判断之前；启动打 `[0/7]`…`[7/7]` 分步点。
            `[0/7]` 只要出现，就证明 dylib 已被加载、constructor 跑过。

            ## 装完先做这一件事

            装完 respring，然后看 `VpnTint.log`（先在 SpringBoard 的 Documents 下找）：

            - 有 `[0/7]` 但没有 `[7/7]` → 卡在某一步，按最后一条编号定位
            - 一条都没有 → 根本没被加载，回到注入/签名层（把新 `SpringBoard-*.ips` 发我）
            - 有 `[7/7]` 但不上色 → 功能层问题，把日志发我

            想在不卸载的前提下排除本插件：在
            `/var/mobile/Library/Preferences/com.liehuu.vpntint.plist` 设 `HookLevel = 0`，
            respring，此时连私有框架都不 dlopen。

            包内**不含任何 maintainer script**（不会打断 dpkg）。
            `vpntint-rootless.deb`：Dopamine / palera1n rootless；`vpntint-roothide.deb`：RootHide / roothide。
          files: out/*.deb
